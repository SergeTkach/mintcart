name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  php-lint:
    name: PHP syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - name: php -l on every .php file
        run: |
          set -e
          status=0
          while IFS= read -r -d '' file; do
            if ! php -l "$file" > /dev/null; then
              php -l "$file"
              status=1
            fi
          done < <(find upload tests -name '*.php' -print0)
          exit "$status"

  php-tests:
    name: MintCart PHP smoke tests
    runs-on: ubuntu-latest
    needs: php-lint
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - name: Run tests/mintcart/**/*-test.php
        run: |
          set -e
          status=0
          while IFS= read -r -d '' file; do
            echo "== $file =="
            if ! php "$file"; then
              status=1
            fi
          done < <(find tests/mintcart -name '*-test.php' -print0)
          exit "$status"

  frontend-build:
    name: Frontend build (esbuild)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
